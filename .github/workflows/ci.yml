name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew build

      - name: Build Docker image
        run: docker build --tag industrial-fault-copilot:ci .
      - name: Run Docker container and check health
        run: |
          docker run -d --name industrial-fault-copilot-ci -p 8080:8080 industrial-fault-copilot:ci
          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            docker logs industrial-fault-copilot-ci
          fi
          docker rm -f industrial-fault-copilot-ci
          test "$healthy" = "true"
