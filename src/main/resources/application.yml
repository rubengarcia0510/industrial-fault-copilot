spring:
  application:
    name: industrial-fault-copilot

  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
